<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A premium browser-based calculator with basic arithmetic operations, operator chaining, and a stunning modern UI.">
  <title>Calculator — Premium Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <main class="calculator" id="calculator">
      <p class="creator-credit">Created by Nayana Chaudhari</p>

      <div class="display" id="display">
        <div class="display-expression" id="display-expression"></div>
        <div class="display-current" id="display-current">0</div>
      </div>

    
      <div class="btn-grid" id="btn-grid">
        <button class="btn btn-util" data-action="clear" id="btn-clear">C</button>
        <button class="btn btn-util" data-action="backspace" id="btn-backspace">⌫</button>
        <button class="btn btn-util" data-action="percent" id="btn-percent">%</button>
        <button class="btn btn-operator" data-action="operator" data-value="÷" id="btn-divide">÷</button>

        <button class="btn btn-number" data-action="number" data-value="7" id="btn-7">7</button>
        <button class="btn btn-number" data-action="number" data-value="8" id="btn-8">8</button>
        <button class="btn btn-number" data-action="number" data-value="9" id="btn-9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="×" id="btn-multiply">×</button>

        <button class="btn btn-number" data-action="number" data-value="4" id="btn-4">4</button>
        <button class="btn btn-number" data-action="number" data-value="5" id="btn-5">5</button>
        <button class="btn btn-number" data-action="number" data-value="6" id="btn-6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="−" id="btn-subtract">−</button>

        <button class="btn btn-number" data-action="number" data-value="1" id="btn-1">1</button>
        <button class="btn btn-number" data-action="number" data-value="2" id="btn-2">2</button>
        <button class="btn btn-number" data-action="number" data-value="3" id="btn-3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+" id="btn-add">+</button>

        <button class="btn btn-number btn-zero" data-action="number" data-value="0" id="btn-0">0</button>
        <button class="btn btn-number" data-action="decimal" id="btn-decimal">.</button>
        <button class="btn btn-equals" data-action="equals" id="btn-equals">=</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
